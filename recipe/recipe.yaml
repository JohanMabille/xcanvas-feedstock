context:
  version: "0.8.0"
  build_number: 0

package:
  name: xcanvas
  version: ${{ version }}

source:
  url: https://github.com/jupyter-xeus/xcanvas/archive/${{ version }}.tar.gz
  sha256: fa29aae0f500f9d72463f7dce58d258919ed8e429ea5b82f9c40b116b09525ab

build:
  number: ${{ build_number }}

requirements:
  run_exports:
    - ${{ pin_subpackage('xcanvas', upper_bound='x.x') }}
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - if: unix
      then:
        - make
  host:
    - xproperty >=0.13.1,<0.14
    - xwidgets >=0.31.1,<0.32
    - nlohmann_json
    - nlohmann_json-abi
  run:
    - ipycanvas >=0.11.0,<0.12

tests:
  - package_contents:
      files:
        exists:
          - ${{ "Library/" if win }}include/xcanvas/xcanvas.hpp
          - ${{ "Library/" if win }}lib/cmake/xcanvas/xcanvasConfig.cmake
          - ${{ "Library/" if win }}lib/cmake/xcanvas/xcanvasConfigVersion.cmake

about:
  homepage: https://github.com/martinRenou/xcanvas
  repository: https://github.com/martinRenou/xcanvas
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: C++ back-end for ipycanvas

extra:
  recipe-maintainers:
    - JohanMabille
    - martinRenou
